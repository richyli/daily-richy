<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>李怡志們</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&family=EB+Garamond:ital@0;1&display=swap">
<style>
:root{--paper:#FFFFFF;--ink:#0A0A0A;--mute:#595959;--hair:#0A0A0A;--faint:#DADADA;
--serif:"Noto Serif TC","Songti TC","PMingLiU",serif;--latin:"EB Garamond","Garamond",Georgia,serif;}
html{background:var(--paper)}
body{background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:17px;line-height:2;
margin:0;padding-inline:20px;padding-block:0 96px}
.wrap{max-width:34rem;margin:0 auto}
.mast{border-bottom:3px solid var(--hair);padding-block:56px 20px}
.mast h1{font-weight:900;font-size:clamp(44px,11vw,76px);line-height:1.05;letter-spacing:.04em;margin:0}
nav.toc{padding-block:18px 0;border-bottom:1px solid var(--hair)}
nav.toc h2{font-family:var(--latin);font-style:italic;font-weight:400;font-size:14px;letter-spacing:.08em;margin:0 0 6px}
nav.toc ol{list-style:none;margin:0;padding:0}
nav.toc li{border-top:1px solid var(--faint)}
nav.toc a{display:grid;grid-template-columns:6.5em 1fr;align-items:baseline;gap:12px;color:var(--ink);text-decoration:none;padding-block:8px;font-size:15px}
nav.toc a:hover span:last-child,nav.toc a:focus-visible span:last-child{text-decoration:underline;text-underline-offset:4px}
nav.toc time{font-family:var(--latin);font-variant-numeric:tabular-nums;color:var(--mute)}
a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
article{padding-block:40px 24px;border-top:3px solid var(--hair);margin-top:16px}
.issue-no{font-family:var(--latin);font-size:16px;margin:0;font-variant-numeric:tabular-nums}
.issue-no span{padding-inline:6px}
.back{margin:0;padding-block:24px 0;font-size:14px;letter-spacing:.2em}.back a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--hair)}
.piece{margin:0 0 20px;font-size:17px}
.issue-head h1{font-weight:900;font-size:clamp(30px,7vw,42px);line-height:1.3;margin:6px 0 8px;text-wrap:balance}
.persona{display:grid;grid-template-columns:repeat(4,auto);border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);margin:0}
.persona div{padding:8px 10px 10px;border-left:1px solid var(--hair)}
.persona div:first-child{border-left:0;padding-left:0}
.persona dt{font-size:11px;letter-spacing:.2em;color:var(--mute);line-height:1.6}
.persona dd{margin:0;font-size:14px;line-height:1.6}
@media (max-width:520px){.persona{grid-template-columns:1fr 1fr}.persona div:nth-child(3){border-left:0;padding-left:0;border-top:1px solid var(--hair)}.persona div:nth-child(4){border-top:1px solid var(--hair)}}
section{margin-top:44px}
h3{font-size:12px;font-weight:600;letter-spacing:.5em;margin:0 0 14px;display:flex;align-items:center;gap:14px}
h3::after{content:"";flex:1;border-top:1px solid var(--hair)}
p{margin:0 0 1.1em;text-align:justify}
blockquote{margin:36px 0;padding-block:22px;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);
font-size:clamp(20px,4.6vw,24px);line-height:1.75;font-weight:600;text-align:left}
.talk p{text-align:left;margin-bottom:.7em;padding-left:2em;text-indent:-2em}
.talk .q{font-weight:600}
.talk .a{font-weight:400}
.talk .dash{letter-spacing:-.1em}
.talk .stage{text-indent:0;padding-left:0;margin-block:1.4em;color:var(--mute);font-size:15px}
.plate{margin:48px 0 0}
.plate img{display:block;width:100%;max-width:100%;height:auto;filter:grayscale(1)}
.plate-empty{aspect-ratio:3/2;max-width:100%;border:1px solid var(--hair);display:grid;place-items:center;
background:repeating-linear-gradient(135deg,transparent 0 11px,var(--faint) 11px 12px)}
.plate-empty span{background:var(--paper);padding:4px 12px;font-size:13px;letter-spacing:.3em}
figcaption{font-size:14px;line-height:1.8;color:var(--mute);padding-top:8px;border-top:1px solid var(--hair);margin-top:10px;white-space:pre-wrap}
.end{text-align:right;font-size:12px;margin-top:28px}
</style>
</head>
<body>
<div class="wrap">
<header class="mast"><h1>李怡志們</h1></header>

</div>
</body>
</html>
